# Vision-engine configuration for MR abdomen
modality: MR
anatomy: abdomen

# Modality-specific processing settings
processing:
  crop_pad:
    size: [384, 384]  # Standard resolution for abdomen MR (H, W)
  resampling:
    target_spacing: [1.0, 1.0, 2.0]  # Typical abdomen MR spacing (x, y, z in mm)
  conversion_backend: "sitk"
  # Slice selection - automatically select middle slices
  slice_selection:
    enabled: true
    slices: 2048  # Select middle 128 slices for abdomen MR
  # Debug helpers
  debug:
    save_resampled_nifti: false
    output_dir: test_output_mr/intermediate_nifti

# External exporter configuration
exporter_config: "video_hevc_mr"  # MR-specific HEVC video compression

# Logging
logging:
  level: "INFO"
  file: null

